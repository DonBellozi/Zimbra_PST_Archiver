services:
  web:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:////data/db/archiver.sqlite3
    ports: ["8085:8085"]
    volumes:
      - workdata:/data/work
      - pstdata:/data/pst
      - dbdata:/data/db
      - ${NAS_MOUNT_PATH:-./nas}:/data/nas
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:////data/db/archiver.sqlite3
    volumes:
      - workdata:/data/work
      - pstdata:/data/pst
      - dbdata:/data/db
      - ${NAS_MOUNT_PATH:-./nas}:/data/nas
    restart: unless-stopped
volumes: {dbdata: {}, workdata: {}, pstdata: {}}
