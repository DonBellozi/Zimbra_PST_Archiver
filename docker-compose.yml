services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archiver}
      POSTGRES_USER: ${POSTGRES_USER:-archiver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-archiver}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-archiver}
    ports: ["8085:8085"]
    volumes:
      - workdata:/data/work
      - pstdata:/data/pst
      - ${NAS_MOUNT_PATH:-./nas}:/data/nas
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-archiver}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-archiver}
    volumes:
      - workdata:/data/work
      - pstdata:/data/pst
      - ${NAS_MOUNT_PATH:-./nas}:/data/nas
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
volumes: {pgdata: {}, workdata: {}, pstdata: {}}

