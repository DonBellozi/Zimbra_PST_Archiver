services:
  web:
    build: .
    environment:
      DATABASE_URL: sqlite:////data/db/archiver.sqlite3
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in stack environment}
    ports: ["8085:8085"]
    volumes:
      - workdata:/data/work
      - pstdata:/data/pst
      - dbdata:/data/db
      - ${NAS_MOUNT_PATH:-./nas}:/data/nas
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: sqlite:////data/db/archiver.sqlite3
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in stack environment}
    volumes:
      - workdata:/data/work
      - pstdata:/data/pst
      - dbdata:/data/db
      - ${NAS_MOUNT_PATH:-./nas}:/data/nas
    restart: unless-stopped
volumes: {dbdata: {}, workdata: {}, pstdata: {}}
