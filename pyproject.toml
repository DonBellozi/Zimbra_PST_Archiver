[project]
name = "zimbra-pst-archiver"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9", "alembic==1.16.5", "jinja2==3.1.6",
  "python-multipart==0.0.20", "passlib[bcrypt]==1.7.4", "bcrypt==4.0.1",
  "cryptography==45.0.7", "paramiko==4.0.0", "itsdangerous==2.2.0",
  "pydantic-settings==2.10.1"
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
