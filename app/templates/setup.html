<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="/static/app.css"><title>Первоначальная настройка</title></head><body><main class="narrow"><form method="post"><h1>Первоначальная настройка</h1><p class="muted">Все значения позднее можно изменить в браузере.</p>
<section class="card"><h2>1. Администратор</h2><div class="grid"><label>Логин<input name="username" required></label><label>Пароль (от 10 символов)<input name="password" type="password" minlength="10" required></label></div></section>
<section class="card"><h2>2. Zimbra 8.8.15</h2><div class="grid"><label>Сервер<input name="zimbra_host" required></label><label>SSH-порт<input name="zimbra_port" value="22" type="number"></label><label>SSH-пользователь<input name="zimbra_user" value="root"></label><label>SHA256 fingerprint хоста<input name="zimbra_host_fingerprint" required placeholder="SHA256:..."></label><label>Авторизация<select name="zimbra_auth"><option value="key">SSH-ключ</option><option value="password">Пароль</option></select></label><label>Пароль<input name="zimbra_password" type="password"></label><label class="wide">Приватный ключ<textarea name="zimbra_private_key" rows="5"></textarea></label><label>Префикс команд<input name="zimbra_sudo_prefix" value="sudo -u zimbra"></label></div></section>
<section class="card"><h2>3. Хранилище и NAS</h2><div class="grid"><label>Рабочий каталог<input name="work_dir" value="/data/work"></label><label>Каталог PST<input name="pst_dir" value="/data/pst"></label><label>NAS подключен<select name="nas_enabled"><option value="false">Нет</option><option value="true">Да</option></select></label><label>Каталог NAS<input name="nas_dir" value="/data/nas"></label></div><p class="muted">SMB/NFS монтируется Docker-хостом в каталог NAS; учетные данные не передаются контейнеру.</p></section>
<section class="card"><h2>4. Политика</h2><div class="grid"><label>Хранение PST, дней<input value="14" disabled><input name="retention_days" value="14" type="hidden"></label><label>Резерв, ГБ<input name="min_free_gb" value="10" type="number"></label><label>Коэффициент оценки<input name="space_factor" value="4.0" type="number" step="0.1"></label><label>Активных задач<input value="1" disabled><input name="concurrency" value="1" type="hidden"></label></div></section><button class="primary">Завершить настройку</button></form></main></body></html>
